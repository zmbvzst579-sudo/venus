<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F2F1ED">
  <meta name="description" content="venus">
  <meta property="og:title" content="venus">
  <meta property="og:description" content="a personal archive">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/image3.webp">
  <title>venus</title>
  <link rel="preload" as="image" href="images/image3.webp">
  <link rel="preload" as="image" href="images/feng.webp">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.0.0/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.0.0/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.0.0/700.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 首帧内联样式：样式表加载前就锁定字体和背景，避免字体闪烁和底色突变 */
    html {
      --paper: #F2F1ED;
      --ink: #34393D;
      --mono: 'Courier New', 'Courier Prime', 'Consolas', 'Noto Serif SC', 'SimSun', 'Songti SC', monospace;
      --type: 'Courier New', 'Courier Prime', 'Consolas', 'Noto Serif SC', 'SimSun', 'Songti SC', monospace;
      --serif: 'Times New Roman', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --kai: 'Kaiti SC', 'KaiTi', 'STKaiti', 'Noto Serif SC', serif;
      --mincho: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    }
    html, body { margin: 0; padding: 0; }
    body {
      background: #F2F1ED;
      color: #34393D;
      font-family: 'Courier New', 'Courier Prime', 'Consolas', 'Noto Serif SC', 'SimSun', 'Songti SC', monospace;
      -webkit-font-smoothing: antialiased;
    }
    .site { opacity: 0; transition: opacity .4s ease; }
    html.fonts-ready .site { opacity: 1; }
  </style>
</head>
<body>
  <div class="site" id="site" data-mode="intro">

    <div class="intro" id="intro" role="button" tabindex="0" aria-label="进入档案">
      <div class="intro-inner">
        <div class="intro-stage">
          <img class="intro-bg" src="images/feng.webp" alt="" decoding="async" fetchpriority="high">
          <h1 class="intro-title">Venus</h1>
        </div>
        <span class="intro-date" id="introDate">2026.10.21*</span>
        <span class="intro-cta">enter</span>
      </div>
    </div>

    <header class="top">
      <button class="top-brand" id="brandBtn" type="button">venus_</button>
      <nav class="nav" id="nav" aria-label="页面导航">
        <button class="dot" data-page="0" type="button" aria-label="封面"></button>
        <button class="dot" data-page="1" type="button" aria-label="风格"></button>
        <button class="dot" data-page="2" type="button" aria-label="单前须知"></button>
        <button class="dot" data-page="3" type="button" aria-label="Notes"></button>
        <button class="dot" data-page="4" type="button" aria-label="价目"></button>
      </nav>
      <span class="top-readout" id="readout" aria-live="polite">COVER</span>
    </header>

    <main class="deck" id="deck" aria-label="档案页"></main>

    <div class="focus" id="focus" aria-hidden="true">
      <div class="focus-backdrop" data-close></div>
      <article class="focus-card" id="focusCard" role="dialog" aria-modal="true">
        <button class="focus-close" data-close type="button" aria-label="关闭">×</button>
        <div class="focus-scroll" id="focusContent"></div>
      </article>
    </div>

    <button class="fab" id="fab" type="button" aria-label="播放音乐">
      <span class="fab-icon">▶</span>
    </button>

    <audio id="bgMusic" src="https://music.163.com/song/media/outer/url?id=2158137238.mp3" loop preload="auto"></audio>

  </div>
  <script src="main.js" defer></script>
</body>
</html>
